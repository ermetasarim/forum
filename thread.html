<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container page">
    <div id="thread-wrap">
      <div class="crumbs">
        <a href="index.html">Forumlar</a> /
        <a href="index.html" id="crumb-cat">Forum</a>
      </div>
      <div class="toolbar">
        <div>
          <div id="thread-flags" style="margin-bottom:4px"></div>
          <h1 class="page-title" id="thread-title"></h1>
        </div>
        <div class="chips">
          <button class="btn btn-outline btn-sm" id="pin-btn" type="button">Sabitle</button>
          <button class="btn btn-outline btn-sm" id="lock-btn" type="button">Kilitle</button>
          <button class="btn btn-danger btn-sm" id="del-btn" type="button">Sil</button>
        </div>
      </div>
      <section class="board">
        <div id="posts"></div>
        <div class="reply-box" id="reply-box">
          <form id="reply-form">
            <textarea name="body" placeholder="Yanıt" required></textarea>
            <div style="display:flex;justify-content:flex-end;margin-top:8px">
              <button class="btn btn-primary" type="submit">Gönder</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
