<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a class="logo" href="index.html"><span class="logo-mark">M</span> Meydan</a>
      <h1>Tekrar hoş geldin</h1>
      <p class="muted" style="margin-bottom:20px">Hesabınla giriş yap, tartışmaya dön.</p>
      <form action="index.html">
        <div class="form-group">
          <label>E-posta veya kullanıcı adı</label>
          <input type="text" placeholder="elif@meydan.com" />
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:.85rem">
          <label><input type="checkbox" checked /> Beni hatırla</label>
          <a href="#" style="color:var(--primary);font-weight:700">Şifremi unuttum</a>
        </div>
        <button class="btn btn-primary" style="width:100%">Giriş yap</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center">Hesabın yok mu? <a href="register.html" style="color:var(--primary);font-weight:700">Kayıt ol</a></p>
    </div>
  </div>
</body>
</html>
