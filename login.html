<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a class="logo" href="login.html"><span class="logo-mark">M</span> Meydan</a>
      <h1>Yönetici girişi</h1>
      <p class="muted" style="margin-bottom:20px">Site yalnızca admin rolüne açık. Üye kaydı kapalı.</p>
      <form id="login-form">
        <div class="form-group">
          <label>E-posta</label>
          <input name="email" type="email" required value="ermetasarim@gmail.com" />
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input name="password" type="password" required />
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">Giriş yap</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center">Kayıt alınmıyor.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
