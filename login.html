<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />

  <title>Giriş</title>

<body>
  <div class="auth-wrap">

      <h1>Giriş</h1>
      <form id="login-form">
        <div class="form-group"><label>E-posta</label><input name="email" type="email" required value="ermetasarim@gmail.com" /></div>

        <button class="btn btn-primary" style="width:100%" type="submit">Giriş</button>
      </form>
      <p class="muted" id="login-note" style="margin-top:12px"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
