<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni konu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container page" style="max-width:760px">
    <div class="crumbs"><a href="index.html">Forumlar</a> / Yeni konu</div>
    <h1 class="page-title" style="margin-bottom:12px">Yeni konu</h1>
    <section class="card" id="new-topic-card" style="padding:16px">
      <form id="new-topic-form">
        <div class="form-group"><label>Forum</label><select id="topic-cat" name="category" required></select></div>
        <div class="form-group"><label>Başlık</label><input name="title" required /></div>
        <div class="form-group"><label>Mesaj</label><textarea name="body" rows="8" required></textarea></div>
        <button class="btn btn-primary" type="submit">Gönder</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
