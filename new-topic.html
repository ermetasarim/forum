<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni konu — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container" style="padding:28px 0 60px;max-width:760px">
    <h1 style="margin-bottom:16px;letter-spacing:-.03em">Yeni konu</h1>
    <section class="card" id="new-topic-card" style="padding:22px">
      <form id="new-topic-form">
        <div class="form-group">
          <label>Kategori</label>
          <select id="topic-cat" name="category" required></select>
        </div>
        <div class="form-group">
          <label>Başlık</label>
          <input name="title" required placeholder="Konu başlığı" />
        </div>
        <div class="form-group">
          <label>İlk mesaj</label>
          <textarea name="body" rows="7" required placeholder="Konuyu aç..."></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Konuyu aç</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
