<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Kontrol Paneli — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-top">
        <div>
          <b>Özet</b>
          <div class="muted" id="admin-who">Admin</div>
        </div>
        <button class="btn btn-outline btn-sm" id="reset-btn" type="button">Veriyi sıfırla</button>
      </div>
      <div class="admin-content">
        <div class="kpi-grid">
          <div class="card kpi"><div class="label">Üye</div><div class="value" id="kpi-users">1</div><div class="delta">yalnızca admin</div></div>
          <div class="card kpi"><div class="label">Konu</div><div class="value" id="kpi-topics">0</div><div class="delta">sıfırlandı</div></div>
          <div class="card kpi"><div class="label">Açık rapor</div><div class="value" id="kpi-reports">0</div><div class="delta">kuyruk boş</div></div>
          <div class="card kpi"><div class="label">Çevrimiçi</div><div class="value" id="kpi-online">1</div><div class="delta up">sen</div></div>
        </div>
        <section class="card">
          <div class="section-head"><h2>Kullanıcılar</h2></div>
          <table class="data">
            <thead><tr><th>Kullanıcı</th><th>E-posta</th><th>Durum</th><th>Tarih</th></tr></thead>
            <tbody id="last-users"></tbody>
          </table>
        </section>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
