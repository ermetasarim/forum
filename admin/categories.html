<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Kategoriler — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-top">
        <div><b>Kategoriler</b><div class="muted">Liste boş — ilk bölümü sen ekle</div></div>
      </div>
      <div class="admin-content">
        <section class="card" style="padding:18px;margin-bottom:16px">
          <form id="cat-form" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group"><label>Ad</label><input name="name" required placeholder="Örn. Teknoloji" /></div>
            <div class="form-group"><label>İkon</label><input name="icon" placeholder="⚙️" /></div>
            <div class="form-group" style="grid-column:1 / -1"><label>Açıklama</label><input name="description" placeholder="Kısa açıklama" /></div>
            <div class="form-group">
              <label>Görünürlük</label>
              <select name="visibility"><option>Herkes</option><option>Üyeler</option></select>
            </div>
            <div class="form-group">
              <label>Yazma</label>
              <select name="writePerm"><option>Yöneticiler</option><option>Üyeler</option></select>
            </div>
            <div style="grid-column:1 / -1"><button class="btn btn-primary" type="submit">Kategori ekle</button></div>
          </form>
        </section>
        <section class="card">
          <table class="data">
            <thead><tr><th>Kategori</th><th>Konu</th><th>Görünürlük</th><th>Yazma</th><th></th></tr></thead>
            <tbody id="cat-body"></tbody>
          </table>
        </section>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
