<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Raporlar — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-top">
        <div><b>Raporlar</b><div class="muted">Canlı sayaçlar</div></div>
      </div>
      <div class="admin-content">
        <div class="kpi-grid">
          <div class="card kpi"><div class="label">Çevrimiçi</div><div class="value" id="r-dau">1</div></div>
          <div class="card kpi"><div class="label">Konu</div><div class="value" id="r-topics">0</div></div>
          <div class="card kpi"><div class="label">Mesaj</div><div class="value" id="r-posts">0</div></div>
          <div class="card kpi"><div class="label">Çözülme</div><div class="value" id="r-solve">—</div></div>
        </div>
        <section class="card" style="padding:22px">
          <p class="muted">Supabase bağlanınca bu sayfa gerçek sorgu sonuçlarını gösterecek. Şimdilik yerel sayaçlar.</p>
        </section>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
