<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Ayarlar — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-top">
        <div><b>Site ayarları</b><div class="muted">Kayıt kilitli</div></div>
      </div>
      <div class="admin-content" style="max-width:720px">
        <section class="card" style="padding:22px">
          <form id="settings-form">
            <div class="form-group"><label>Site adı</label><input name="siteName" /></div>
            <div class="form-group"><label>Slogan</label><input name="tagline" /></div>
            <div class="form-group">
              <label>Kayıt politikası</label>
              <select name="registration" disabled>
                <option value="closed">Kapalı — yalnızca admin</option>
              </select>
            </div>
            <div class="form-group">
              <label>Bakım modu</label>
              <select name="maintenance">
                <option value="off">Kapalı</option>
                <option value="on">Açık</option>
              </select>
            </div>
            <div class="form-group">
              <label>Karşılama</label>
              <textarea name="welcome" rows="4"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Kaydet</button>
          </form>
        </section>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
