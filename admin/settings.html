<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Ayarlar — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><span class="logo-mark">M</span> Meydan Admin</div>
      <div class="nav-label">Genel</div>
      <a class="nav-link" href="dashboard.html">📊 Kontrol paneli</a>
      <a class="nav-link" href="users.html">👥 Kullanıcılar</a>
      <a class="nav-link" href="moderation.html">🛡️ Moderasyon</a>
      <a class="nav-link" href="categories.html">📁 Kategoriler</a>
      <div class="nav-label">Sistem</div>
      <a class="nav-link active" href="settings.html">⚙️ Ayarlar</a>
      <a class="nav-link" href="reports.html">📈 Raporlar</a>
      <a class="nav-link" href="../index.html">↩ Siteye dön</a>
    </aside>
    <div class="admin-main">
      <div class="admin-top">
        <div><b>Site ayarları</b><div class="muted">Genel, kayıt ve güvenlik</div></div>
        <button class="btn btn-primary btn-sm">Kaydet</button>
      </div>
      <div class="admin-content" style="max-width:720px">
        <section class="card" style="padding:22px">
          <div class="form-group"><label>Site adı</label><input value="Meydan" /></div>
          <div class="form-group"><label>Slogan</label><input value="Fikirlerin buluştuğu yer" /></div>
          <div class="form-group">
            <label>Kayıt politikası</label>
            <select>
              <option>Açık kayıt + e-posta onayı</option>
              <option>Davetiye</option>
              <option>Yönetici onayı</option>
            </select>
          </div>
          <div class="form-group">
            <label>Bakım modu</label>
            <select>
              <option>Kapalı</option>
              <option>Açık — yalnızca yöneticiler</option>
            </select>
          </div>
          <div class="form-group">
            <label>Hoş geldin mesajı</label>
            <textarea rows="4">Meydan'a hoş geldin. Kuralları oku, sonra ilk konunu aç.</textarea>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
