<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayıt — Meydan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a class="logo" href="index.html"><span class="logo-mark">M</span> Meydan</a>
      <h1>Aramıza katıl</h1>
      <p class="muted" style="margin-bottom:20px">Birkaç saniye, sonra konuşmaya başla.</p>
      <form action="index.html">
        <div class="form-group">
          <label>Kullanıcı adı</label>
          <input type="text" placeholder="ayseyilmaz" />
        </div>
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" placeholder="sen@ornek.com" />
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" placeholder="En az 8 karakter" />
        </div>
        <button class="btn btn-primary" style="width:100%">Hesap oluştur</button>
      </form>
      <p class="muted" style="margin-top:16px;text-align:center">Zaten üye misin? <a href="login.html" style="color:var(--primary);font-weight:700">Giriş yap</a></p>
    </div>
  </div>
</body>
</html>
